<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Rodrigo</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="calculadora">

        <div class="encabezado">
            <h1>Calculadora</h1>
            <p>Creado por Rodrigo</p>
        </div>

        <div class="pantalla">
            <div id="operacionAnterior"></div>
            <input id="pantalla" type="text" value="0" readonly>
        </div>

        <div class="botones">

            <button class="especial" onclick="borrar()">C</button>
            <button class="especial" onclick="borrarUltimo()">⌫</button>
            <button class="especial" onclick="raiz()">√</button>
            <button class="operador" onclick="guardarOperacion('/')">÷</button>

            <button onclick="numero('7')">7</button>
            <button onclick="numero('8')">8</button>
            <button onclick="numero('9')">9</button>
            <button class="operador" onclick="guardarOperacion('*')">×</button>

            <button onclick="numero('4')">4</button>
            <button onclick="numero('5')">5</button>
            <button onclick="numero('6')">6</button>
            <button class="operador" onclick="guardarOperacion('-')">−</button>

            <button onclick="numero('1')">1</button>
            <button onclick="numero('2')">2</button>
            <button onclick="numero('3')">3</button>
            <button class="operador" onclick="guardarOperacion('+')">+</button>

            <button class="cero" onclick="numero('0')">0</button>
            <button onclick="punto()">.</button>
            <button class="operador" onclick="guardarOperacion('^')">^</button>

            <button class="igual" onclick="calcular()">=</button>

        </div>

        <footer>
            Calculadora Web • Rodrigo
        </footer>

        <div class="mensaje-secreto">
            consultar autografos con mi manager
        </div>

    </main>

    <script src="calculadora.js"></script>

</body>

</html>
